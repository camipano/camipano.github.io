name: Vakitler (Diyanet, cami başına)
on:
  schedule:
    - cron: "41 4 * * *"
    - cron: "17 13 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [camiler.json]
permissions:
  contents: write
  pages: write
concurrency:
  group: vakitler
  cancel-in-progress: false
jobs:
  vakitler:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24 }
      - run: node --test arac/vakit/test/*.test.mjs
      - id: uret
        run: node arac/vakit/uret.mjs
        timeout-minutes: 15
        continue-on-error: true
        env:
          # Diyanet Awqat Salah API kimliği (birincil kaynak); yoksa resmî sayfa → ayna. Yalnız bu adım görür.
          AWQAT_KULLANICI: ${{ secrets.AWQAT_KULLANICI }}
          AWQAT_SIFRE: ${{ secrets.AWQAT_SIFRE }}
          # Elle başlatılan koşu 90 günlük DateRange ister (ayda konum başına 10 istek sınırı; zamanlı koşuda yalnız pazartesi).
          AWQAT_ARALIK: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
      - id: yayin
        name: Değiştiyse yayınla
        run: |
          git config user.name "camipano-vakit"
          git config user.email "camipano-vakit@users.noreply.github.com"
          # Yalnız bu koşuda üretimi başarılı camiler eklenir (c/.basarili); liste yoksa/boşsa yayımlanacak bir şey yoktur.
          if [ ! -s c/.basarili ]; then echo "itildi=0" >> "$GITHUB_OUTPUT"; echo "başarılı cami yok, yayımlanacak bir şey yok"; exit 0; fi
          while IFS= read -r id || [ -n "$id" ]; do
            [ -n "$id" ] || continue
            git add -- "c/$id/vakitler.json" 2>/dev/null || true
          done < c/.basarili
          if git diff --cached --quiet; then echo "itildi=0" >> "$GITHUB_OUTPUT"; echo "değişiklik yok"; exit 0; fi
          git commit -m "Vakitler: Diyanet güncellemesi"
          for i in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then echo "itildi=1" >> "$GITHUB_OUTPUT"; exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((i * 10))
          done
          exit 1
      - name: Pages derlemesini iste (GITHUB_TOKEN commit'i klasik derlemeyi tetiklemez)
        if: steps.yayin.outputs.itildi == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
      - name: Eşdeğerlik gözcüsü (Ulu Camii ↔ canlı site)
        run: node arac/vakit/esdeger.mjs
      - name: Başarısız cami varsa işi kırmızı bitir
        if: steps.uret.outcome == 'failure'
        run: exit 1
